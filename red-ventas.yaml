apiVersion: v1
kind: Service
metadata:
  name: ventas-service
spec:
  selector:
    app: canal-ventas
  ports:
    - protocol: TCP
      port: 80         # Puerto del servicio
      targetPort: 5000 # Puerto interno de la App
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ventas-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ventas.local # <--- La URL que usará el cliente
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ventas-service
            port:
              number: 80
